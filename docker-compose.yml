version: "3.8"
services:
  vpsbot:
    image: discord-vps-bot:latest
    build: .
    container_name: discord-vps-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/app/data
    networks:
      - vpsbot-net

networks:
  vpsbot-net:
    driver: bridge
